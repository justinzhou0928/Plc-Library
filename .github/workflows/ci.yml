name: CI/CD

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - run: dotnet restore
    - run: dotnet build --configuration Release --no-restore
    - run: dotnet test --configuration Release --no-build --verbosity normal
    - run: dotnet pack --configuration Release --no-build --output ./nupkgs

    - uses: actions/upload-artifact@v4
      with:
        name: nupkgs
        path: ./nupkgs/*.nupkg

  publish-github:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
    - uses: actions/download-artifact@v4
      with:
        name: nupkgs
        path: ./nupkgs

    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - run: >
        dotnet nuget push ./nupkgs/*.nupkg
        --source https://nuget.pkg.github.com/justinzhou0928/index.json
        --api-key ${{ secrets.GITHUB_TOKEN }}
        --skip-duplicate

  publish-nuget:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
    - uses: actions/download-artifact@v4
      with:
        name: nupkgs
        path: ./nupkgs

    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Exchange OIDC token with NuGet.org
      run: |
        JWT=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
          "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=nuget.org" | jq -r .value)
        echo "NUGET_TOKEN=$JWT" >> $GITHUB_ENV

    - name: Publish to NuGet.org
      run: >
        dotnet nuget push ./nupkgs/*.nupkg
        --source https://api.nuget.org/v3/index.json
        --api-key ${{ env.NUGET_TOKEN }}
        --skip-duplicate
