name: CI/CD

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
    branches: [master, main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - run: dotnet restore
    - run: dotnet build --configuration Release --no-restore
    - name: Run tests
      run: >
        dotnet test --configuration Release --no-build --verbosity normal
        --results-directory ./TestResults
        --logger "trx;LogFileName=test-results.trx"

    - name: Report failed tests
      if: failure()
      run: |
        python3 - <<'PY'
        import glob
        import xml.etree.ElementTree as ET

        ns = {'t': 'http://microsoft.com/schemas/VisualStudio/TeamTest/2010'}
        for path in glob.glob('TestResults/*.trx'):
            root = ET.parse(path).getroot()
            for result in root.findall('.//t:UnitTestResult', ns):
                if result.get('outcome') != 'Failed':
                    continue
                name = result.get('testName', '<unknown>')
                node = result.find('.//t:Output/t:ErrorInfo/t:Message', ns)
                message = ' '.join((node.text or '').split())[:800] if node is not None else ''
                print(f'::error title=Failed test::{name} :: {message}')
        PY

    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: ./TestResults

    - run: dotnet pack --configuration Release --no-build --output ./nupkgs

    - uses: actions/upload-artifact@v4
      with:
        name: nupkgs
        path: ./nupkgs/*.nupkg

  publish-github:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
    - uses: actions/download-artifact@v4
      with:
        name: nupkgs
        path: ./nupkgs

    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - run: >
        dotnet nuget push ./nupkgs/*.nupkg
        --source https://nuget.pkg.github.com/justinzhou0928/index.json
        --api-key ${{ secrets.GITHUB_TOKEN }}
        --skip-duplicate

  publish-nuget:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    env:
      NUGET_API_KEY: ${{ secrets.NUGET }}
    steps:
    - uses: actions/download-artifact@v4
      with:
        name: nupkgs
        path: ./nupkgs

    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Publish to NuGet.org
      id: nuget
      if: env.NUGET_API_KEY != ''
      continue-on-error: true
      run: >
        dotnet nuget push ./nupkgs/*.nupkg
        --source https://api.nuget.org/v3/index.json
        --api-key "$NUGET_API_KEY"
        --skip-duplicate

    - name: NuGet.org publish failed
      if: steps.nuget.outcome == 'failure'
      run: echo "::warning::NuGet.org publish failed (check NUGET secret/permissions); GitHub Packages publish succeeded."

    - name: NuGet secret not configured
      if: env.NUGET_API_KEY == ''
      run: echo "::notice::NUGET secret is not configured; NuGet.org publish skipped."
